helm_version: '0'
product:
  slug: helm
  name: Helm

issue_tracker:
  provider: github_projects
  org: lhpaul
  project_number: 3
  custom_field_name: Helm Stage

code_repos:
  - url: https://github.com/lhpaul/helm
    default_branch: develop
    role: app

knowledge_repo:
  url: https://github.com/lhpaul/helm-knowledge
  default_branch: main

workflow:
  stages_enabled:
    - discovery
    - spec-draft
    - spec-ready
    - plan-draft
    - plan-ready
    - in-development
    - code-review
    - remediation
    - merged
    - released
  # final_stage default is released (ADR-032): impl merge → merged, ship → released
  designer_gate: skip
  qa_gate: skip

review:
  external:
    # `codex-github` is the active reviewer, in an **open dogfood trial**
    # (lhpaul/helm#100) — not yet promoted to the standing default. Haystack was
    # retired end-to-end by lhpaul/helm#85 (ADR-036 addendum) — the product
    # schema now rejects `provider: haystack` and any `review.external.haystack`
    # block.
    #
    # `codex-github` was briefly the default (2026-08-14) and was rolled back
    # the same day: Codex had no terminal signal for a *clean* run, so a clean
    # PR stayed deferred until its intent expired.
    #
    # lhpaul/helm#96 (2026-08-18) implemented that signal — head-pinned review
    # or `Reviewed commit` summary evidence. Nothing else reads as clean: a
    # rate-limited or environment-missing response ranks as unavailable, a
    # stale or draft review is dropped, and a reaction-only response never
    # enters the evidence set at all, since Helm reads no reactions
    # (ADR-036, 2026-08-18 addendum §4).
    #
    # 2026-08-18: switched to `codex-github` to run the scoped trial ADR-036 §7
    # requires — one real PR reviewed end-to-end under the new contract, with
    # validation evidence captured on lhpaul/helm#100 (including the
    # abbreviated-marker-SHA width Codex emits in practice, ADR-036 §6). This
    # switch is the trial, on its own change; **promotion** to the standing
    # default remains a separate, explicitly approved decision recorded on #100,
    # and ADR-036 §7 is not amended until that decision lands. The
    # 2026-08-14 rollback is the precedent for keeping the two apart. If the
    # trial fails, revert this file to `provider: coderabbit` — its config stays
    # below as the rollback target, as Bugbot's does.
    provider: codex-github
    defer_when_pending: true
    resume_on_check_run: true
    codex_github:
      # Exact review-author logins. The `[bot]` account is the app; the
      # un-suffixed login is left out on purpose (a human could register it).
      trusted_identities:
        - 'chatgpt-codex-connector[bot]'
      # Only used to name an in-flight analysis in the deferral reason.
      check_names:
        - Codex
        - Codex Review
      # Codex only reports P0/P1, which normalize to critical/high.
      blocking_severities:
        - critical
        - high
    bugbot:
      # GitHub check-run name observed in dogfood (Cursor app).
      check_names:
        - Cursor Bugbot
        - Bugbot
        - Bugbot / Review
        - Cursor / Bugbot
    coderabbit:
      status_contexts:
        - CodeRabbit
      trusted_identities:
        - 'coderabbitai[bot]'
        - coderabbitai
        - 'coderabbitai-pro[bot]'
  loop:
    max_cycles: 5
    adjudication:
      enabled: true
    stop_rule:
      no_progress_cycles: 2

# Codex headless bills against the ChatGPT subscription (~$0 marginal).
# Claude Code `claude -p` (Helm's ClaudeCodeRuntime) is metered API — see ADR-021.
specialists:
  spec-writer:
    runtime: codex
    model: gpt-5.4-mini
  plan-writer:
    runtime: codex
    model: gpt-5.4-mini
  implementer:
    runtime: codex
    model: gpt-5.5
  code-reviewer:
    runtime: codex
    model: gpt-5.4-mini
  security-reviewer:
    runtime: codex
    model: gpt-5.4-mini
  test-reviewer:
    runtime: codex
    model: gpt-5.4-mini
  spec-remediator:
    runtime: codex
    model: gpt-5.4-mini
  plan-remediator:
    runtime: codex
    model: gpt-5.4-mini
  code-remediator:
    runtime: codex
    model: gpt-5.5
  review-adjudicator:
    runtime: codex
    model: gpt-5.4-mini
