name: Knowledge CI

# Lightweight checks for spec/plan/ADR PRs (#127): markdown lint, required
# files and REVIEW.md. No application build or tests. No secrets, and no
# pull_request_target: the workflow runs the PR's own code with a read-only token.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: knowledge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  knowledge-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Markdown lint
        run: npx --yes markdownlint-cli2@0.18.1 "**/*.md" "#node_modules"
      - name: Required files, REVIEW.md and changed specs/plans
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/check-knowledge.sh "origin/$BASE_REF"
